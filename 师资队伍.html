<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            list-style: none;
            text-decoration: none;
        }
        /* 导航栏 */
        .nav{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background-color: rgba(128, 0, 128, 0.8);
            display: flex;
            align-items: center;
            z-index: 999;
        }
        .school-name{
            font-family: SimSun,serif;
            font-size: 40px;
            font-weight: bold;
            color: gold;
            letter-spacing: 3px;
            padding: 0 30px;
            display: flex;      
            align-items: center;  
            gap: 10px; 
            z-index: 999;
        }
        .logo-img{
            left: 50px;
            height: 60px;
            width: auto;
        }
        .nav-list{
            display: flex;
        }
        .nav-list a{
            display: block;
            height: 60px;
            line-height: 60px;
            padding: 0 30px;
            color: #ffffff;
            font-size: large;
            transition: 0.3s ease;
        }
        .nav-list a:hover{
            background-color: #2486d6;
        }
        /* 搜索栏 */
        .search-box{
            display: flex;
            border-radius: 4px;
            border: none;
        }
        .search-box button{
            padding: 7px 12px;
            padding: 7px 12px;
            border: none;
            background:#2486d6;
            color:#fff;
            cursor:pointer;
        }
        .search-box{
            display: flex;
            gap: 6px;
         margin-left: 20px;
        }
        .search-box input{
            padding: 7px;
            border-radius: 4px;
             border: none;
        }
        /* 右侧固定小盒子 */
        .look-more{
            position: fixed;
            right: 0px;
            top: 300px;
            width: 50px;
            height: 150px;
            line-height: 40px;
            text-align: center;
            background: #800080;
            border-radius: 6px;
            color:#fff9cc;
            font-weight: bold;
            z-index: 99;
            writing-mode: vertical-lr;
            letter-spacing: 10px; 
        }
    </style>
</head>
<body>
    <div class="nav">
        <div class="school-name">
            <img class="logo-img" src="logo.png" alt="校徽">
            <span>皮城大学</span>
        </div>
        <div class="nav-list">
            <a href="首页.html">首页</a>
            <a href="学校概况.html">学校概况</a>
            <a href="院系设置.html">院系设置</a>
            <a href="机构设置.html">机构设置</a>
            <a href="师资队伍.html">师资队伍</a>
            <a href="国际交流.html">国际交流</a>
            <a href="招生就业.html">招生就业</a>
        </div>
        <form action="https://www.baidu.com/s" method="get" class="search-box">
            <input type="text" name="wd" placeholder="输入内容百度查找">
            <button type="submit">搜索</button>
        </form>
    </div>
    <div class="look-more">广告位招租</div>
    <h1 style="margin: 100px auto 0;">优秀校友</h1>
    <img src="super.png" alt="" >
</body>
</html>
